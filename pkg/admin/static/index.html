<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chango Admin</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --accent-hover: #79c0ff;
    --success: #3fb950;
    --error: #f85149;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header h1 span { color: var(--text-muted); font-weight: 400; }
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }
  .sidebar {
    width: 220px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
  }
  .sidebar ul { list-style: none; padding: 8px 0; }
  .sidebar li {
    padding: 8px 16px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-muted);
    transition: background 0.15s;
  }
  .sidebar li:hover { background: rgba(88,166,255,0.1); color: var(--text); }
  .sidebar li.active { background: rgba(88,166,255,0.15); color: var(--accent); }
  .sidebar li.missing { opacity: 0.5; font-style: italic; }
  .editor-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .editor-toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .editor-toolbar .filename {
    font-size: 14px;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    color: var(--accent);
    flex: 1;
  }
  .btn {
    padding: 6px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  textarea {
    flex: 1;
    width: 100%;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    border: none;
    outline: none;
    resize: none;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 14px;
    line-height: 1.6;
    tab-size: 2;
  }
  .status {
    padding: 8px 16px;
    font-size: 13px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    transition: color 0.3s;
  }
  .status.ok { color: var(--success); }
  .status.err { color: var(--error); }
  .status.idle { color: var(--text-muted); }
  .empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 15px;
  }
  /* Login overlay */
  .login-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .login-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 340px;
  }
  .login-box h2 { margin-bottom: 20px; font-size: 20px; }
  .login-box input {
    width: 100%;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
    margin-bottom: 16px;
    outline: none;
  }
  .login-box input:focus { border-color: var(--accent); }
  .login-box .btn { width: 100%; }
  .login-error { color: var(--error); font-size: 13px; margin-bottom: 12px; display: none; }

  /* Health panel */
  .health-panel {
    flex: 1;
    padding: 24px;
    overflow-y: auto;
  }
  .health-panel h2 { font-size: 16px; margin-bottom: 16px; font-weight: 600; }
  .health-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .health-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .health-card .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .health-card .value { font-size: 28px; font-weight: 600; margin: 6px 0 4px; font-family: 'SF Mono', monospace; }
  .health-card .sub { font-size: 12px; color: var(--text-muted); }
  .health-card .value.warn { color: #d29922; }
  .health-card .value.crit { color: var(--error); }
  .health-card .value.good { color: var(--success); }
  .health-bar {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    margin-top: 8px;
    overflow: hidden;
  }
  .health-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.5s;
  }
  .health-alerts { margin-top: 16px; }
  .health-alerts .alert-item {
    background: rgba(248,81,73,0.1);
    border: 1px solid rgba(248,81,73,0.3);
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 13px;
    color: var(--error);
  }
  .health-meta { font-size: 12px; color: var(--text-muted); margin-top: 16px; }
  .health-section { margin-top: 24px; }
  .health-section h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--text-muted); }
  .health-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    font-family: 'SF Mono', monospace;
  }
  .health-table th {
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--text-muted);
    font-weight: 500;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .health-table td {
    padding: 8px 12px;
    border-bottom: 1px solid rgba(48,54,61,0.5);
  }
  .health-table .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .dot-up { background: var(--success); }
  .dot-down { background: var(--text-muted); }
  .health-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .btn-action {
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-action:hover { border-color: var(--accent); color: var(--accent); }
  .btn-action:disabled { opacity: 0.5; cursor: wait; }
  .scan-results {
    margin-top: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    display: none;
  }
  .scan-results h3 { font-size: 14px; margin-bottom: 10px; }
  .scan-results .close-btn {
    float: right;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 16px;
  }
  .scan-results .close-btn:hover { color: var(--text); }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 6px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Vault styles */
  .vault-panel { flex: 1; padding: 24px; overflow-y: auto; }
  .vault-panel h2 { font-size: 16px; margin-bottom: 16px; font-weight: 600; }
  .vault-folders {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .vault-folder-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .vault-folder-card:hover { border-color: var(--accent); }
  .vault-folder-card.active { border-color: var(--accent); background: rgba(88,166,255,0.08); }
  .vault-folder-card .folder-name { font-size: 14px; font-weight: 500; }
  .vault-folder-card .folder-count { font-size: 24px; font-weight: 600; font-family: 'SF Mono', monospace; color: var(--accent); margin: 4px 0; }
  .vault-total { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
  .vault-notes-list { margin-top: 16px; }
  .vault-note-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .vault-note-item:hover { border-color: var(--accent); }
  .vault-note-key { font-size: 14px; font-weight: 500; color: var(--accent); font-family: 'SF Mono', monospace; }
  .vault-note-preview { font-size: 13px; color: var(--text-muted); margin-top: 4px; line-height: 1.4; }
  .vault-note-meta { font-size: 11px; color: var(--text-muted); margin-top: 6px; display: flex; gap: 12px; }
  .vault-tag { background: rgba(88,166,255,0.1); color: var(--accent); padding: 2px 8px; border-radius: 4px; font-size: 11px; }
  .vault-back {
    background: none; border: none; color: var(--accent); cursor: pointer;
    font-size: 13px; margin-bottom: 12px; padding: 0;
  }
  .vault-back:hover { text-decoration: underline; }
  .vault-note-actions { display: flex; gap: 8px; margin-top: 8px; }

  .sidebar .section-label {
    padding: 12px 16px 4px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
  }

  @media (max-width: 640px) {
    .sidebar { width: 160px; }
    .sidebar li { padding: 8px 12px; font-size: 13px; }
    .health-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2>Chango Admin</h2>
    <div class="login-error" id="loginError">Token incorrecto</div>
    <input type="password" id="tokenInput" placeholder="Admin token" autofocus>
    <button class="btn btn-primary" onclick="doLogin()">Entrar</button>
  </div>
</div>

<header>
  <h1>Chango <span>Admin</span></h1>
  <button class="btn" onclick="doLogout()">Salir</button>
</header>

<div class="main">
  <nav class="sidebar">
    <div class="section-label">Sistema</div>
    <ul><li id="healthNav" onclick="showHealth()">Raspberry Pi</li></ul>
    <div class="section-label">Memoria</div>
    <ul><li id="vaultNav" onclick="showVault()">Obsidian Vault</li></ul>
    <div class="section-label">Archivos</div>
    <ul id="fileList"></ul>
  </nav>
  <div class="editor-wrap" id="editorWrap">
    <div class="empty-state" id="emptyState">Selecciona un archivo</div>
    <div class="health-panel" id="healthPanel" style="display:none"></div>
    <div class="vault-panel" id="vaultPanel" style="display:none"></div>
    <div style="display:none;flex-direction:column;flex:1;overflow:hidden" id="editorPanel">
      <div class="editor-toolbar">
        <span class="filename" id="currentFile"></span>
        <button class="btn btn-primary" id="saveBtn" onclick="saveFile()">Guardar</button>
      </div>
      <textarea id="editor" spellcheck="false"></textarea>
      <div class="status idle" id="statusBar">Listo</div>
    </div>
  </div>
</div>

<script>
const API = window.location.origin;
let token = '';
let currentFile = null;
let dirty = false;

function headers() {
  return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
}

// Login
function doLogin() {
  token = document.getElementById('tokenInput').value.trim();
  if (!token) return;
  fetch(API + '/api/files', { headers: headers() })
    .then(r => {
      if (r.status === 401) {
        document.getElementById('loginError').style.display = 'block';
        return;
      }
      localStorage.setItem('chango_admin_token', token);
      document.getElementById('loginOverlay').style.display = 'none';
      return r.json();
    })
    .then(files => { if (files) renderFileList(files); })
    .catch(() => { document.getElementById('loginError').style.display = 'block'; });
}

document.getElementById('tokenInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

function doLogout() {
  localStorage.removeItem('chango_admin_token');
  token = '';
  document.getElementById('loginOverlay').style.display = 'flex';
  document.getElementById('tokenInput').value = '';
  document.getElementById('tokenInput').focus();
}

// Check saved token
(function init() {
  const saved = localStorage.getItem('chango_admin_token');
  if (saved) {
    token = saved;
    fetch(API + '/api/files', { headers: headers() })
      .then(r => {
        if (r.ok) {
          document.getElementById('loginOverlay').style.display = 'none';
          return r.json();
        }
        throw new Error('unauthorized');
      })
      .then(files => renderFileList(files))
      .catch(() => {
        localStorage.removeItem('chango_admin_token');
        token = '';
      });
  }
})();

function renderFileList(files) {
  const ul = document.getElementById('fileList');
  ul.innerHTML = '';
  files.forEach(f => {
    const li = document.createElement('li');
    li.textContent = f.name;
    if (!f.exists) li.classList.add('missing');
    li.onclick = () => openFile(f.name, li);
    ul.appendChild(li);
  });
}

function openFile(name, el) {
  if (dirty && !confirm('Tenés cambios sin guardar. ¿Descartar?')) return;

  document.querySelectorAll('.sidebar li').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
  hideHealth();

  setStatus('Cargando...', 'idle');
  fetch(API + '/api/files/' + encodeURIComponent(name), { headers: headers() })
    .then(r => { if (!r.ok) throw new Error(r.statusText); return r.json(); })
    .then(data => {
      currentFile = name;
      document.getElementById('currentFile').textContent = name;
      document.getElementById('editor').value = data.content;
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('editorPanel').style.display = 'flex';
      dirty = false;
      setStatus('Listo', 'idle');
    })
    .catch(e => setStatus('Error: ' + e.message, 'err'));
}

function saveFile() {
  if (!currentFile) return;
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  setStatus('Guardando...', 'idle');

  fetch(API + '/api/files/' + encodeURIComponent(currentFile), {
    method: 'PUT',
    headers: headers(),
    body: JSON.stringify({ content: document.getElementById('editor').value })
  })
    .then(r => { if (!r.ok) throw new Error(r.statusText); return r.json(); })
    .then(() => {
      dirty = false;
      setStatus('Guardado', 'ok');
      setTimeout(() => { if (!dirty) setStatus('Listo', 'idle'); }, 2000);
    })
    .catch(e => setStatus('Error: ' + e.message, 'err'))
    .finally(() => { btn.disabled = false; });
}

document.getElementById('editor').addEventListener('input', () => { dirty = true; });

// Ctrl+S / Cmd+S
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    if (currentFile) saveFile();
  }
});

function setStatus(msg, cls) {
  const bar = document.getElementById('statusBar');
  bar.textContent = msg;
  bar.className = 'status ' + cls;
}

// Health
let healthInterval = null;

function showHealth() {
  if (dirty && !confirm('Tenés cambios sin guardar. ¿Descartar?')) return;
  dirty = false;
  currentFile = null;

  document.querySelectorAll('.sidebar li').forEach(x => x.classList.remove('active'));
  document.getElementById('healthNav').classList.add('active');
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('editorPanel').style.display = 'none';
  document.getElementById('vaultPanel').style.display = 'none';
  document.getElementById('healthPanel').style.display = 'block';

  loadHealth();
  if (healthInterval) clearInterval(healthInterval);
  healthInterval = setInterval(loadHealth, 30000);
}

function hideHealth() {
  document.getElementById('healthPanel').style.display = 'none';
  document.getElementById('vaultPanel').style.display = 'none';
  if (healthInterval) { clearInterval(healthInterval); healthInterval = null; }
}

function loadHealth() {
  fetch(API + '/api/health', { headers: headers() })
    .then(r => { if (!r.ok) throw new Error(r.statusText); return r.json(); })
    .then(renderHealth)
    .catch(e => {
      document.getElementById('healthPanel').innerHTML =
        '<div class="empty-state">Error cargando datos: ' + e.message + '</div>';
    });
}

function renderHealth(d) {
  const s = d.sentinel || {};
  const tempCls = s.cpu_temp_c >= 80 ? 'crit' : s.cpu_temp_c >= 70 ? 'warn' : 'good';
  const ramCls = s.ram_used_percent >= 90 ? 'crit' : s.ram_used_percent >= 80 ? 'warn' : 'good';
  const diskCls = s.disk_used_percent >= 95 ? 'crit' : s.disk_used_percent >= 80 ? 'warn' : 'good';
  const swapCls = d.swap_used_percent >= 90 ? 'crit' : d.swap_used_percent >= 50 ? 'warn' : 'good';

  const upH = Math.floor((s.uptime_seconds||0) / 3600);
  const upM = Math.floor(((s.uptime_seconds||0) % 3600) / 60);
  const uptime = upH > 0 ? upH + 'h ' + upM + 'm' : upM + 'm';

  const ago = s.last_check ? timeSince(s.last_check) : 'n/a';

  let html = '<h2>Raspberry Pi 5</h2><div class="health-grid">';

  html += card('CPU Temp', (s.cpu_temp_c||0).toFixed(1) + '\u00B0', tempCls, '', s.cpu_temp_c, 100);
  html += card('RAM', (s.ram_used_percent||0).toFixed(0) + '%', ramCls,
    ((s.ram_total_mb||0) - (s.ram_available_mb||0)) + ' / ' + (s.ram_total_mb||0) + ' MB', s.ram_used_percent, 100);
  html += card('Swap', d.swap_used_percent.toFixed(0) + '%', swapCls,
    (d.swap_total_mb - d.swap_free_mb) + ' / ' + d.swap_total_mb + ' MB', d.swap_used_percent, 100);
  html += card('Disco', (s.disk_used_percent||0).toFixed(0) + '%', diskCls,
    ((s.disk_total_gb||0) - (s.disk_free_gb||0)).toFixed(1) + ' / ' + (s.disk_total_gb||0).toFixed(1) + ' GB', s.disk_used_percent, 100);
  html += card('Uptime', uptime, 'good', '');

  html += '</div>';

  // Alertas
  if (s.alerts && s.alerts.length > 0) {
    html += '<div class="health-alerts"><h2>Alertas</h2>';
    s.alerts.forEach(a => { html += '<div class="alert-item">' + esc(a) + '</div>'; });
    html += '</div>';
  }

  // Red
  if (d.networks && d.networks.length > 0) {
    html += '<div class="health-section"><h3>Red</h3><table class="health-table">';
    html += '<tr><th>Interfaz</th><th>Estado</th><th>IP</th><th>RX</th><th>TX</th></tr>';
    d.networks.forEach(n => {
      const dot = n.state === 'up' ? 'dot-up' : 'dot-down';
      html += '<tr><td>' + esc(n.name) + '</td>';
      html += '<td><span class="dot ' + dot + '"></span>' + n.state + '</td>';
      html += '<td>' + (n.ip || '-') + '</td>';
      html += '<td>' + fmtBytes(n.rx_bytes) + '</td>';
      html += '<td>' + fmtBytes(n.tx_bytes) + '</td></tr>';
    });
    html += '</table></div>';
  }

  // Bluetooth
  if (d.bluetooth && d.bluetooth.length > 0) {
    html += '<div class="health-section"><h3>Bluetooth</h3><table class="health-table">';
    html += '<tr><th>Adaptador</th><th>Estado</th><th>Direcci\u00F3n</th></tr>';
    d.bluetooth.forEach(b => {
      const dot = b.state === 'up' ? 'dot-up' : 'dot-down';
      html += '<tr><td>' + esc(b.name) + '</td>';
      html += '<td><span class="dot ' + dot + '"></span>' + b.state + '</td>';
      html += '<td>' + (b.address || '-') + '</td></tr>';
    });
    html += '</table></div>';
  }

  // Action buttons
  html += '<div class="health-actions">';
  html += '<button class="btn-action" id="btnFreeSwap" onclick="freeSwap()">Liberar Swap</button>';
  html += '<button class="btn-action" id="btnWifiScan" onclick="scanWifi()">Escanear WiFi</button>';
  html += '<button class="btn-action" id="btnBtScan" onclick="scanBluetooth()">Escanear Bluetooth</button>';
  html += '</div>';

  // Scan results area
  html += '<div class="scan-results" id="scanResults"></div>';

  html += '<div class="health-meta">Sentinel: ' + ago + ' &middot; se refresca cada 30s</div>';
  document.getElementById('healthPanel').innerHTML = html;
}

function fmtBytes(b) {
  if (!b || b === 0) return '0 B';
  const u = ['B', 'KB', 'MB', 'GB', 'TB'];
  const i = Math.floor(Math.log(b) / Math.log(1024));
  return (b / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0) + ' ' + u[i];
}

function card(label, value, cls, sub, pct, max) {
  let h = '<div class="health-card"><div class="label">' + label + '</div>';
  h += '<div class="value ' + cls + '">' + value + '</div>';
  if (sub) h += '<div class="sub">' + sub + '</div>';
  if (pct !== undefined && max) {
    const c = cls === 'crit' ? 'var(--error)' : cls === 'warn' ? '#d29922' : 'var(--success)';
    h += '<div class="health-bar"><div class="health-bar-fill" style="width:' +
      Math.min(pct, 100) + '%;background:' + c + '"></div></div>';
  }
  h += '</div>';
  return h;
}

function timeSince(iso) {
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'hace ' + s + 's';
  if (s < 3600) return 'hace ' + Math.floor(s / 60) + 'min';
  return 'hace ' + Math.floor(s / 3600) + 'h';
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// Actions
function freeSwap() {
  const btn = document.getElementById('btnFreeSwap');
  if (!confirm('Esto va a liberar el swap (swapoff + swapon). Puede tardar unos segundos.')) return;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Liberando...';
  fetch(API + '/api/swap/free', { method: 'POST', headers: headers() })
    .then(r => r.json())
    .then(data => {
      if (data.error) throw new Error(data.error);
      btn.textContent = 'Swap liberado!';
      setTimeout(() => { btn.textContent = 'Liberar Swap'; btn.disabled = false; loadHealth(); }, 2000);
    })
    .catch(e => {
      btn.textContent = 'Error';
      showScanResults('Error', '<div class="alert-item">' + esc(e.message) + '</div>');
      setTimeout(() => { btn.textContent = 'Liberar Swap'; btn.disabled = false; }, 3000);
    });
}

function scanWifi() {
  const btn = document.getElementById('btnWifiScan');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Escaneando...';
  fetch(API + '/api/wifi/scan', { method: 'POST', headers: headers() })
    .then(r => r.json())
    .then(data => {
      btn.textContent = 'Escanear WiFi';
      btn.disabled = false;
      if (data.error) { showScanResults('Error', '<div class="alert-item">' + esc(data.error) + '</div>'); return; }
      if (!data.length) { showScanResults('WiFi', '<p style="color:var(--text-muted)">No se encontraron redes</p>'); return; }
      let t = '<table class="health-table"><tr><th>SSID</th><th>Signal</th><th>Freq</th><th>Canal</th><th>BSSID</th></tr>';
      data.forEach(n => {
        t += '<tr><td>' + esc(n.ssid) + '</td><td>' + esc(n.signal) + '</td><td>' + esc(n.freq) + '</td><td>' + (n.channel||'-') + '</td><td style="color:var(--text-muted)">' + esc(n.bssid) + '</td></tr>';
      });
      t += '</table>';
      showScanResults('Redes WiFi (' + data.length + ')', t);
    })
    .catch(e => {
      btn.textContent = 'Escanear WiFi';
      btn.disabled = false;
      showScanResults('Error', '<div class="alert-item">' + esc(e.message) + '</div>');
    });
}

function scanBluetooth() {
  const btn = document.getElementById('btnBtScan');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Escaneando (~8s)...';
  fetch(API + '/api/bluetooth/scan', { method: 'POST', headers: headers() })
    .then(r => r.json())
    .then(data => {
      btn.textContent = 'Escanear Bluetooth';
      btn.disabled = false;
      if (data.error) { showScanResults('Error', '<div class="alert-item">' + esc(data.error) + '</div>'); return; }
      if (!data.length) { showScanResults('Bluetooth', '<p style="color:var(--text-muted)">No se encontraron dispositivos</p>'); return; }
      let t = '<table class="health-table"><tr><th>Nombre</th><th>Direcci\u00F3n</th></tr>';
      data.forEach(d => {
        t += '<tr><td>' + esc(d.name) + '</td><td style="color:var(--text-muted)">' + esc(d.address) + '</td></tr>';
      });
      t += '</table>';
      showScanResults('Dispositivos Bluetooth (' + data.length + ')', t);
    })
    .catch(e => {
      btn.textContent = 'Escanear Bluetooth';
      btn.disabled = false;
      showScanResults('Error', '<div class="alert-item">' + esc(e.message) + '</div>');
    });
}

function showScanResults(title, html) {
  const el = document.getElementById('scanResults');
  el.style.display = 'block';
  el.innerHTML = '<button class="close-btn" onclick="this.parentElement.style.display=\'none\'">&times;</button><h3>' + title + '</h3>' + html;
}

// --- Vault ---
let vaultData = null;
let vaultCurrentFolder = null;

function showVault() {
  if (dirty && !confirm('Tenes cambios sin guardar. Descartar?')) return;
  dirty = false;
  currentFile = null;

  document.querySelectorAll('.sidebar li').forEach(x => x.classList.remove('active'));
  document.getElementById('vaultNav').classList.add('active');
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('editorPanel').style.display = 'none';
  hideHealth();
  document.getElementById('vaultPanel').style.display = 'block';

  loadVault();
}

function hideVault() {
  document.getElementById('vaultPanel').style.display = 'none';
}

function loadVault() {
  fetch(API + '/api/vault', { headers: headers() })
    .then(r => { if (!r.ok) throw new Error(r.statusText); return r.json(); })
    .then(data => { vaultData = data; renderVaultOverview(); })
    .catch(e => {
      document.getElementById('vaultPanel').innerHTML =
        '<div class="empty-state">Error cargando vault: ' + e.message + '</div>';
    });
}

function renderVaultOverview() {
  const d = vaultData;
  let html = '<h2>Obsidian Vault</h2>';
  html += '<div class="vault-total">' + d.total_notes + ' notas en total</div>';
  html += '<div class="vault-folders">';
  d.folders.forEach(f => {
    const active = vaultCurrentFolder === f.name ? ' active' : '';
    html += '<div class="vault-folder-card' + active + '" onclick="openVaultFolder(\'' + f.name + '\')">';
    html += '<div class="folder-count">' + f.count + '</div>';
    html += '<div class="folder-name">' + esc(f.name) + '/</div>';
    html += '</div>';
  });
  html += '</div>';
  html += '<div id="vaultNotesArea"></div>';
  document.getElementById('vaultPanel').innerHTML = html;

  if (vaultCurrentFolder) openVaultFolder(vaultCurrentFolder);
}

function openVaultFolder(folder) {
  vaultCurrentFolder = folder;
  // Update active state on folder cards
  document.querySelectorAll('.vault-folder-card').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.vault-folder-card').forEach(c => {
    if (c.querySelector('.folder-name').textContent === folder + '/') c.classList.add('active');
  });

  const area = document.getElementById('vaultNotesArea');
  area.innerHTML = '<div class="spinner"></div> Cargando...';

  fetch(API + '/api/vault/notes?folder=' + encodeURIComponent(folder), { headers: headers() })
    .then(r => { if (!r.ok) throw new Error(r.statusText); return r.json(); })
    .then(notes => {
      if (!notes || notes.length === 0) {
        area.innerHTML = '<p style="color:var(--text-muted);margin-top:16px">Sin notas en ' + esc(folder) + '/</p>';
        return;
      }
      let html = '<div class="vault-notes-list">';
      html += '<div style="font-size:13px;color:var(--text-muted);margin-bottom:12px">' + notes.length + ' nota(s) en ' + esc(folder) + '/</div>';
      notes.forEach(n => {
        html += '<div class="vault-note-item" onclick="openVaultNote(\'' + esc(folder) + '\',\'' + esc(n.key) + '\')">';
        html += '<div class="vault-note-key">' + esc(n.key) + '</div>';
        if (n.preview) html += '<div class="vault-note-preview">' + esc(n.preview) + '</div>';
        html += '<div class="vault-note-meta">';
        if (n.tags && n.tags.length) {
          n.tags.forEach(t => { html += '<span class="vault-tag">' + esc(t) + '</span>'; });
        }
        if (n.updated) html += '<span>' + timeSince(n.updated) + '</span>';
        html += '</div></div>';
      });
      html += '</div>';
      area.innerHTML = html;
    })
    .catch(e => { area.innerHTML = '<div class="alert-item">Error: ' + esc(e.message) + '</div>'; });
}

function openVaultNote(folder, key) {
  if (dirty && !confirm('Tenes cambios sin guardar. Descartar?')) return;

  const panel = document.getElementById('vaultPanel');
  panel.innerHTML = '<div class="spinner"></div> Cargando nota...';

  fetch(API + '/api/vault/note/' + encodeURIComponent(folder) + '/' + encodeURIComponent(key), { headers: headers() })
    .then(r => { if (!r.ok) throw new Error(r.statusText); return r.json(); })
    .then(data => {
      let html = '<button class="vault-back" onclick="renderVaultOverview()">&larr; Volver a ' + esc(folder) + '/</button>';
      html += '<h2 style="font-family:\'SF Mono\',monospace;font-size:15px;margin-bottom:4px">' + esc(key) + '</h2>';
      html += '<div style="font-size:12px;color:var(--text-muted);margin-bottom:16px">' + esc(folder) + '/' + esc(key) + '.md</div>';
      html += '<textarea id="vaultEditor" style="width:100%;min-height:400px;padding:16px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;font-family:\'SF Mono\',monospace;font-size:14px;line-height:1.6;resize:vertical;outline:none" spellcheck="false">' + esc(data.content) + '</textarea>';
      html += '<div class="vault-note-actions">';
      html += '<button class="btn btn-primary" onclick="saveVaultNote(\'' + esc(folder) + '\',\'' + esc(key) + '\')">Guardar</button>';
      html += '<button class="btn" style="border-color:var(--error);color:var(--error)" onclick="deleteVaultNote(\'' + esc(folder) + '\',\'' + esc(key) + '\')">Eliminar</button>';
      html += '</div>';
      html += '<div class="status idle" id="vaultStatus" style="margin-top:8px;font-size:13px"></div>';
      panel.innerHTML = html;
      document.getElementById('vaultEditor').addEventListener('input', () => { dirty = true; });
      dirty = false;
    })
    .catch(e => { panel.innerHTML = '<button class="vault-back" onclick="renderVaultOverview()">&larr; Volver</button><div class="alert-item">Error: ' + esc(e.message) + '</div>'; });
}

function saveVaultNote(folder, key) {
  const content = document.getElementById('vaultEditor').value;
  const status = document.getElementById('vaultStatus');
  status.textContent = 'Guardando...';
  status.className = 'status idle';

  fetch(API + '/api/vault/note/' + encodeURIComponent(folder) + '/' + encodeURIComponent(key), {
    method: 'PUT', headers: headers(),
    body: JSON.stringify({ content: content })
  })
    .then(r => { if (!r.ok) throw new Error(r.statusText); return r.json(); })
    .then(() => {
      dirty = false;
      status.textContent = 'Guardado';
      status.className = 'status ok';
      setTimeout(() => { status.textContent = ''; status.className = 'status idle'; }, 2000);
    })
    .catch(e => { status.textContent = 'Error: ' + e.message; status.className = 'status err'; });
}

function deleteVaultNote(folder, key) {
  if (!confirm('Eliminar nota "' + key + '"?')) return;

  fetch(API + '/api/vault/note/' + encodeURIComponent(folder) + '/' + encodeURIComponent(key), {
    method: 'DELETE', headers: headers()
  })
    .then(r => { if (!r.ok) throw new Error(r.statusText); return r.json(); })
    .then(() => {
      dirty = false;
      loadVault();
    })
    .catch(e => {
      const status = document.getElementById('vaultStatus');
      if (status) { status.textContent = 'Error: ' + e.message; status.className = 'status err'; }
    });
}
</script>
