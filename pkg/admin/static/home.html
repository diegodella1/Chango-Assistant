<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chango</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'SF Mono', 'Fira Code', ui-monospace, monospace;
    background: #050505;
    color: #d4d4d4;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  canvas {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  .ui {
    position: relative;
    z-index: 1;
    text-align: center;
    pointer-events: none;
    margin-top: 240px;
  }
  .name {
    font-size: 20px;
    font-weight: 500;
    color: #e5e5e5;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 8px;
    font-size: 11px;
    color: #404040;
  }
  .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #262626;
  }
  .dot.on { background: #22c55e; box-shadow: 0 0 4px #22c55e88; }
  .stats {
    display: flex;
    gap: 24px;
    justify-content: center;
    margin-top: 20px;
    font-size: 10px;
    color: #333;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .stats span { color: #555; }
  .links {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-top: 16px;
    pointer-events: auto;
  }
  .links a {
    color: #333;
    text-decoration: none;
    font-size: 11px;
    transition: color 0.2s;
  }
  .links a:hover { color: #888; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="name">Chango</div>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="st">...</span>
  </div>
  <div class="stats">
    <div><span id="up">--</span> uptime</div>
    <div><span id="mem">--</span> memories</div>
    <div><span id="mdl">--</span></div>
  </div>
  <div class="links">
    <a href="/admin">admin</a>
    <a href="/pitch/">pitch</a>
  </div>
</div>

<script>
// === Micro neural network — tiny LED neurons with electric glow ===
(function(){
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  const S = Math.min(window.innerWidth, window.innerHeight, 500);
  c.width = S * 2; c.height = S * 2;
  c.style.width = S + 'px'; c.style.height = S + 'px';
  ctx.scale(2, 2);

  const cx = S/2, cy = S/2 - 30; // center, slightly above middle

  // Neurons — small points in a compact brain shape
  const N = 200;
  const neurons = [];
  for (let i = 0; i < N; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 30 + Math.random() * 100;
    const spread = 0.7 + Math.random() * 0.6;
    neurons.push({
      x: cx + Math.cos(a) * r * 1.2 * spread,
      y: cy + Math.sin(a) * r * 0.85 * spread,
      vx: (Math.random() - 0.5) * 0.08,
      vy: (Math.random() - 0.5) * 0.08,
      base: 0.15 + Math.random() * 0.15, // base brightness
      glow: 0, // current glow (0-1, added on fire)
      size: 0.6 + Math.random() * 0.8,
    });
  }

  // Static connections — nearby neurons are always faintly connected
  const connections = [];
  for (let i = 0; i < N; i++) {
    for (let j = i+1; j < N; j++) {
      const dx = neurons[i].x - neurons[j].x, dy = neurons[i].y - neurons[j].y;
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d < 45) connections.push({ a: i, b: j, dist: d });
    }
  }

  // Active synapses — fire on events
  const synapses = [];
  const MAX_SYN = 60;
  for (let i = 0; i < MAX_SYN; i++) synapses.push({ ci: -1, life: 0, max: 0 });

  // SSE — real activity drives the visualization
  let pending = 0;
  const burst = { think: 10, tool: 6, memory: 15, browse: 8, learn: 20, cron: 4, heartbeat: 3 };
  try {
    const es = new EventSource(location.origin + '/api/public/events');
    es.onmessage = e => { pending += (burst[e.data] || 5); };
  } catch(e){}

  function frame() {
    requestAnimationFrame(frame);
    ctx.clearRect(0, 0, S, S);

    // Update neuron positions (gentle drift)
    for (const n of neurons) {
      n.x += n.vx; n.y += n.vy;
      const dx = n.x - cx, dy = n.y - cy;
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d > 120) { n.vx -= dx * 0.0002; n.vy -= dy * 0.0002; }
      n.vx += (Math.random()-0.5) * 0.005;
      n.vy += (Math.random()-0.5) * 0.005;
      n.vx *= 0.998; n.vy *= 0.998;
      n.glow *= 0.95; // decay glow
    }

    // Fire synapses from events
    for (let s = 0; s < MAX_SYN; s++) {
      if (synapses[s].life <= 0 && (pending > 0 || Math.random() < 0.002)) {
        if (pending > 0) pending--;
        // Pick a random connection to fire
        const ci = Math.floor(Math.random() * connections.length);
        synapses[s].ci = ci;
        synapses[s].max = 30 + Math.random() * 40;
        synapses[s].life = synapses[s].max;
        // Light up the neurons at endpoints
        neurons[connections[ci].a].glow = 1;
        neurons[connections[ci].b].glow = 1;
      }
      if (synapses[s].life > 0) synapses[s].life--;
    }

    // Draw static connections (very faint)
    for (const conn of connections) {
      const na = neurons[conn.a], nb = neurons[conn.b];
      const alpha = 0.03;
      ctx.beginPath();
      ctx.moveTo(na.x, na.y);
      ctx.lineTo(nb.x, nb.y);
      ctx.strokeStyle = 'rgba(180,140,60,' + alpha + ')';
      ctx.lineWidth = 0.3;
      ctx.stroke();
    }

    // Draw active synapses (electric glow)
    for (let s = 0; s < MAX_SYN; s++) {
      if (synapses[s].life <= 0 || synapses[s].ci < 0) continue;
      const t = synapses[s].life / synapses[s].max;
      const alpha = Math.sin(t * Math.PI) * 0.7;
      const conn = connections[synapses[s].ci];
      if (!conn) continue;
      const na = neurons[conn.a], nb = neurons[conn.b];

      // Glow line
      ctx.beginPath();
      ctx.moveTo(na.x, na.y);
      ctx.lineTo(nb.x, nb.y);
      ctx.strokeStyle = 'rgba(217,169,60,' + alpha + ')';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Brighter core
      ctx.beginPath();
      ctx.moveTo(na.x, na.y);
      ctx.lineTo(nb.x, nb.y);
      ctx.strokeStyle = 'rgba(255,220,120,' + (alpha * 0.5) + ')';
      ctx.lineWidth = 0.4;
      ctx.stroke();
    }

    // Draw neurons (tiny LED dots)
    for (const n of neurons) {
      const brightness = n.base + n.glow * 0.85;
      const r = n.size;

      // Outer glow (LED bloom)
      if (n.glow > 0.1) {
        const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, r * 6);
        grad.addColorStop(0, 'rgba(217,169,60,' + (n.glow * 0.3) + ')');
        grad.addColorStop(1, 'rgba(217,169,60,0)');
        ctx.beginPath();
        ctx.arc(n.x, n.y, r * 6, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
      }

      // Core dot
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      const coreR = Math.round(180 + brightness * 75);
      const coreG = Math.round(140 + brightness * 80);
      const coreB = Math.round(40 + brightness * 40);
      ctx.fillStyle = 'rgba(' + coreR + ',' + coreG + ',' + coreB + ',' + brightness + ')';
      ctx.fill();
    }
  }
  frame();
})();

// Status
fetch(location.origin + '/api/public/status')
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(d => {
    document.getElementById('dot').classList.add('on');
    document.getElementById('st').textContent = 'online' + (d.uptime ? ' · ' + d.uptime : '');
    if (d.uptime_short || d.uptime) document.getElementById('up').textContent = d.uptime_short || d.uptime;
    if (d.notes !== undefined) document.getElementById('mem').textContent = d.notes;
    if (d.model) document.getElementById('mdl').textContent = d.model;
  })
  .catch(() => { document.getElementById('st').textContent = 'offline'; });
</script>
</body>
</html>
