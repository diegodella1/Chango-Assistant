<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chango</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'SF Mono', 'Fira Code', ui-monospace, monospace;
    background: #050505;
    color: #d4d4d4;
    overflow: hidden;
    height: 100vh;
  }
  canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
  }
  .ui {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 1;
    padding: 32px 40px;
    background: linear-gradient(transparent, rgba(5,5,5,0.85) 40%, rgba(5,5,5,0.98));
    pointer-events: none;
  }
  .inner { max-width: 560px; }
  .name {
    font-size: 18px;
    font-weight: 500;
    color: #e5e5e5;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    font-size: 11px;
    color: #404040;
  }
  .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #262626;
  }
  .dot.on { background: #22c55e; box-shadow: 0 0 4px #22c55e88; }
  .stats {
    display: flex;
    gap: 24px;
    margin-top: 14px;
    font-size: 10px;
    color: #333;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .stats span { color: #555; }
  .links {
    display: flex;
    gap: 16px;
    margin-top: 12px;
    pointer-events: auto;
  }
  .links a {
    color: #333;
    text-decoration: none;
    font-size: 11px;
    transition: color 0.2s;
  }
  .links a:hover { color: #888; }
  .activity {
    position: fixed;
    top: 16px; right: 20px;
    z-index: 2;
    font-size: 10px;
    color: #2a2a2a;
    text-align: right;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .activity .event {
    transition: color 0.3s;
    color: #2a2a2a;
  }
  .activity .event.active {
    color: #d97706;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="activity">
  <div class="event" id="ev">idle</div>
</div>
<div class="ui">
  <div class="inner">
    <div class="name">Chango</div>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="st">...</span>
    </div>
    <div class="stats">
      <div><span id="up">--</span> uptime</div>
      <div><span id="mem">--</span> memories</div>
      <div><span id="mdl">--</span></div>
    </div>
    <div class="links">
      <a href="/about">about</a>
      <a href="/admin">admin</a>
      <a href="/pitch/">pitch</a>
    </div>
  </div>
</div>

<script>
(function(){
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W, H;

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    c.style.width = W + 'px'; c.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // --- Neurons: 500 tiny points, brain-shaped, fills most of the screen ---
  const N = 500;
  const neurons = [];
  const cx = () => W / 2;
  const cy = () => H / 2 - 40;

  for (let i = 0; i < N; i++) {
    const a = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const rBase = 0.25 + Math.random() * 0.75;
    neurons.push({
      // Normalized positions, scaled at render time
      nx: Math.sin(phi) * Math.cos(a) * rBase * 1.3,
      ny: Math.cos(phi) * rBase * 0.9,
      nz: Math.sin(phi) * Math.sin(a) * rBase,
      vx: (Math.random() - 0.5) * 0.0004,
      vy: (Math.random() - 0.5) * 0.0004,
      base: 0.12 + Math.random() * 0.13,
      glow: 0,
      size: 0.5 + Math.random() * 0.7,
    });
  }

  // --- Static connections: nearby neurons ---
  const conns = [];
  const CONN_THRESHOLD = 0.22;
  for (let i = 0; i < N; i++) {
    for (let j = i + 1; j < N; j++) {
      const dx = neurons[i].nx - neurons[j].nx;
      const dy = neurons[i].ny - neurons[j].ny;
      const dz = neurons[i].nz - neurons[j].nz;
      const d = Math.sqrt(dx*dx + dy*dy + dz*dz);
      if (d < CONN_THRESHOLD) conns.push({ a: i, b: j, d: d });
    }
  }

  // --- Active synapses (lightning bolts) ---
  const MAX_SYN = 100;
  const synapses = [];
  for (let i = 0; i < MAX_SYN; i++) {
    synapses.push({ ci: -1, life: 0, max: 0, bolts: null });
  }

  // Generate realistic lightning bolt with recursive branching
  function makeBolt(x1, y1, x2, y2, depth) {
    const pts = [{ x: x1, y: y1 }];
    const segments = 6 + Math.floor(Math.random() * 6);
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.sqrt(dx*dx + dy*dy);
    if (len < 1) return pts;
    const perpX = -dy / len, perpY = dx / len;
    // Strong zigzag displacement — key to looking like real lightning
    const displacement = len * 0.35;
    for (let i = 1; i < segments; i++) {
      const t = i / segments;
      const jitter = (Math.random() - 0.5) * displacement;
      // Add slight curve for organic feel
      const curve = Math.sin(t * Math.PI) * len * 0.08 * (Math.random() - 0.5);
      pts.push({
        x: x1 + dx * t + perpX * jitter + perpX * curve,
        y: y1 + dy * t + perpY * jitter + perpY * curve,
      });
    }
    pts.push({ x: x2, y: y2 });
    return pts;
  }

  // Draw a lightning bolt with multi-layer glow
  function drawBolt(pts, alpha) {
    if (pts.length < 2) return;
    // Layer 1: wide outer glow (blurred)
    ctx.save();
    ctx.filter = 'blur(4px)';
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.strokeStyle = 'rgba(217,140,30,' + (alpha * 0.3) + ')';
    ctx.lineWidth = 5;
    ctx.stroke();
    ctx.restore();

    // Layer 2: medium glow
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.strokeStyle = 'rgba(230,180,60,' + (alpha * 0.5) + ')';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Layer 3: bright core
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.strokeStyle = 'rgba(255,240,180,' + (alpha * 0.8) + ')';
    ctx.lineWidth = 0.6;
    ctx.stroke();
  }

  // --- SSE: real activity ---
  let pending = 0;
  let lastEvent = 'idle';
  const burst = { think: 12, tool: 8, memory: 18, browse: 10, learn: 25, cron: 5, heartbeat: 4 };
  const evEl = document.getElementById('ev');
  let evTimeout;

  try {
    const es = new EventSource(location.origin + '/api/public/events');
    es.onmessage = function(e) {
      pending += (burst[e.data] || 6);
      lastEvent = e.data;
      evEl.textContent = e.data;
      evEl.classList.add('active');
      clearTimeout(evTimeout);
      evTimeout = setTimeout(() => {
        evEl.classList.remove('active');
        evEl.textContent = 'idle';
      }, 3000);
    };
  } catch(e) {}

  // --- Render ---
  let time = 0;

  function getScreenPos(n) {
    // Scale factor: fill ~70% of viewport
    const scale = Math.min(W, H) * 0.38;
    return {
      x: cx() + n.nx * scale,
      y: cy() + n.ny * scale,
    };
  }

  function frame() {
    requestAnimationFrame(frame);
    time += 0.002;
    ctx.clearRect(0, 0, W, H);

    // Slow rotation
    const cos = Math.cos(time * 0.3), sin = Math.sin(time * 0.3);

    // Update neuron positions (gentle drift + slow rotation)
    for (const n of neurons) {
      n.nx += n.vx;
      n.ny += n.vy;
      const d = Math.sqrt(n.nx*n.nx + n.ny*n.ny + n.nz*n.nz);
      if (d > 0.85) {
        n.vx -= n.nx * 0.00008;
        n.vy -= n.ny * 0.00008;
      }
      n.vx += (Math.random() - 0.5) * 0.00002;
      n.vy += (Math.random() - 0.5) * 0.00002;
      n.vx *= 0.999; n.vy *= 0.999;
      n.glow *= 0.94;

      // Apply slow Y rotation for 3D feel
      const rx = n.nx * cos - n.nz * sin;
      const rz = n.nx * sin + n.nz * cos;
      n._rx = rx; n._rz = rz;
    }

    // Fire synapses from real events (+ very slow ambient)
    for (let s = 0; s < MAX_SYN; s++) {
      if (synapses[s].life <= 0 && (pending > 0 || Math.random() < 0.001)) {
        if (pending > 0) pending--;
        const ci = Math.floor(Math.random() * conns.length);
        const conn = conns[ci];
        const na = neurons[conn.a], nb = neurons[conn.b];
        const pa = getScreenPos(na), pb = getScreenPos(nb);
        synapses[s].ci = ci;
        synapses[s].max = 20 + Math.random() * 30;
        synapses[s].life = synapses[s].max;
        // Generate lightning bolt along the connection path
        synapses[s].bolts = [
          makeBolt(pa.x, pa.y, pb.x, pb.y, 1),
        ];
        // Re-generate bolt shape periodically for flickering effect
        synapses[s].lastRegen = 0;
        // Light up endpoint neurons strongly
        na.glow = 1; nb.glow = 1;
        // Cascade: light up nearby neurons for propagation effect
        for (let k = 0; k < N; k++) {
          const dx = neurons[k].nx - na.nx, dy = neurons[k].ny - na.ny;
          if (dx*dx + dy*dy < 0.015) neurons[k].glow = Math.max(neurons[k].glow, 0.5);
        }
      }
      if (synapses[s].life > 0) {
        synapses[s].life--;
        // Flicker: regenerate bolt shape every few frames for electric effect
        synapses[s].lastRegen = (synapses[s].lastRegen || 0) + 1;
        if (synapses[s].lastRegen > 3) {
          synapses[s].lastRegen = 0;
          const conn = conns[synapses[s].ci];
          if (conn) {
            const pa = getScreenPos(neurons[conn.a]), pb = getScreenPos(neurons[conn.b]);
            synapses[s].bolts = [makeBolt(pa.x, pa.y, pb.x, pb.y, 1)];
          }
        }
      }
    }

    // Draw static connections (very faint network)
    ctx.lineWidth = 0.3;
    for (const conn of conns) {
      const pa = getScreenPos(neurons[conn.a]);
      const pb = getScreenPos(neurons[conn.b]);
      ctx.beginPath();
      ctx.moveTo(pa.x, pa.y);
      ctx.lineTo(pb.x, pb.y);
      ctx.strokeStyle = 'rgba(120,90,30,0.04)';
      ctx.stroke();
    }

    // Draw active lightning bolts (electric glow on existing connections)
    for (let s = 0; s < MAX_SYN; s++) {
      if (synapses[s].life <= 0 || !synapses[s].bolts) continue;
      const t = synapses[s].life / synapses[s].max;
      const alpha = Math.sin(t * Math.PI);
      for (const bolt of synapses[s].bolts) {
        drawBolt(bolt, alpha);
      }
    }

    // Draw neurons with multi-layer glow
    for (const n of neurons) {
      const p = getScreenPos(n);
      const brightness = n.base + n.glow * 0.85;
      const r = n.size;

      // Layer 1: wide soft glow (always visible, stronger when active)
      const glowRadius = r * (6 + n.glow * 10);
      const glowAlpha = 0.03 + n.glow * 0.35;
      ctx.save();
      if (n.glow > 0.2) ctx.filter = 'blur(2px)';
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowRadius);
      grad.addColorStop(0, 'rgba(230,180,50,' + glowAlpha + ')');
      grad.addColorStop(0.3, 'rgba(210,150,30,' + (glowAlpha * 0.4) + ')');
      grad.addColorStop(1, 'rgba(180,120,20,0)');
      ctx.beginPath();
      ctx.arc(p.x, p.y, glowRadius, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.restore();

      // Layer 2: core dot (bright when active)
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      const coreAlpha = Math.min(brightness * 1.2, 1);
      if (n.glow > 0.3) {
        // Hot white-yellow core when firing
        ctx.fillStyle = 'rgba(255,245,200,' + coreAlpha + ')';
      } else {
        // Dim warm ember at rest
        const cr = Math.round(120 + brightness * 80);
        const cg = Math.round(80 + brightness * 60);
        const cb = Math.round(15 + brightness * 20);
        ctx.fillStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',' + coreAlpha + ')';
      }
      ctx.fill();
    }
  }
  frame();
})();

// Status
fetch(location.origin + '/api/public/status')
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(d => {
    document.getElementById('dot').classList.add('on');
    document.getElementById('st').textContent = 'online' + (d.uptime ? ' · ' + d.uptime : '');
    if (d.uptime_short || d.uptime) document.getElementById('up').textContent = d.uptime_short || d.uptime;
    if (d.notes !== undefined) document.getElementById('mem').textContent = d.notes;
    if (d.model) document.getElementById('mdl').textContent = d.model;
  })
  .catch(() => { document.getElementById('st').textContent = 'offline'; });
</script>
</body>
</html>
