<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chango</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'SF Mono', 'Fira Code', ui-monospace, monospace;
    background: #060608;
    color: #d4d4d4;
    overflow: hidden;
    height: 100vh;
  }
  canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
  }
  .ui {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 1;
    padding: 32px 40px;
    background: linear-gradient(transparent, rgba(5,5,5,0.85) 40%, rgba(5,5,5,0.98));
    pointer-events: none;
  }
  .inner { max-width: 560px; }
  .name {
    font-size: 18px;
    font-weight: 500;
    color: #e5e5e5;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    font-size: 11px;
    color: #404040;
  }
  .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #262626;
  }
  .dot.on { background: #22c55e; box-shadow: 0 0 4px #22c55e88; }
  .stats {
    display: flex;
    gap: 24px;
    margin-top: 14px;
    font-size: 10px;
    color: #333;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .stats span { color: #555; }
  .links {
    display: flex;
    gap: 16px;
    margin-top: 12px;
    pointer-events: auto;
  }
  .links a {
    color: #333;
    text-decoration: none;
    font-size: 11px;
    transition: color 0.2s;
  }
  .links a:hover { color: #888; }
  .activity {
    position: fixed;
    top: 16px; right: 20px;
    z-index: 2;
    font-size: 10px;
    color: #2a2a2a;
    text-align: right;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .activity .event {
    transition: color 0.3s;
    color: #2a2a2a;
  }
  .legend {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-size: 9px;
    opacity: 0.25;
    transition: opacity 0.5s;
  }
  .legend:hover { opacity: 0.7; }
  .legend span { white-space: nowrap; }
  .activity .event.active { color: #60a5fa; }
  .activity .event.active[data-type="think"]     { color: #818cf8; }
  .activity .event.active[data-type="memory"]    { color: #34d399; }
  .activity .event.active[data-type="learn"]     { color: #fbbf24; }
  .activity .event.active[data-type="browse"]    { color: #38bdf8; }
  .activity .event.active[data-type="tool"]      { color: #f472b6; }
  .activity .event.active[data-type="reasoning"] { color: #c084fc; }
  .activity .event.active[data-type="cron"]      { color: #94a3b8; }
  .activity .event.active[data-type="heartbeat"] { color: #fb7185; }
  .desc {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 0;
    text-align: center;
    padding-bottom: 160px;
    font-size: 11px;
    color: #333;
    letter-spacing: 0.04em;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="activity">
  <div class="event" id="ev">idle</div>
  <div class="legend" id="legend">
    <span style="color:#818cf8">● think</span>
    <span style="color:#34d399">● memory</span>
    <span style="color:#fbbf24">● learn</span>
    <span style="color:#38bdf8">● browse</span>
    <span style="color:#f472b6">● tool</span>
    <span style="color:#c084fc">● reasoning</span>
  </div>
</div>
<div class="desc">each neuron is a real-time event — everything you see is live</div>
<div class="ui">
  <div class="inner">
    <div class="name">Chango</div>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="st">...</span>
    </div>
    <div class="stats">
      <div><span id="up">--</span> uptime</div>
      <div><span id="mem">--</span> memories</div>
      <div><span id="mdl">--</span></div>
    </div>
    <div class="links">
      <a href="/about">about</a>
      <a href="/admin">admin</a>
      <a href="/pitch/">pitch</a>
    </div>
  </div>
</div>

<script>
(function(){
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W, H;

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    c.style.width = W + 'px'; c.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // --- Neurons: 500 points in brain shape (two hemispheres, denser at cortex) ---
  const N = 500;
  const neurons = [];
  const cx = () => W / 2;
  const cy = () => H / 2 - 30;

  for (let i = 0; i < N; i++) {
    const a = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    // Brain shape: wider than tall, with a slight indentation at top (longitudinal fissure)
    let rBase = 0.35 + Math.random() * 0.6;
    // Cortex density: more neurons at the surface (r > 0.6)
    if (Math.random() < 0.6) rBase = 0.6 + Math.random() * 0.35;
    let nx = Math.sin(phi) * Math.cos(a) * rBase;
    let ny = Math.cos(phi) * rBase;
    let nz = Math.sin(phi) * Math.sin(a) * rBase;
    // Brain proportions: wider (1.4x), shorter (0.75y), with frontal lobe bias
    nx *= 1.4;
    ny *= 0.75;
    // Longitudinal fissure: push neurons away from center-top
    const topness = Math.max(0, 0.5 - Math.abs(ny - 0.3));
    const centerDist = Math.abs(nx);
    if (centerDist < 0.15 && topness > 0.1) {
      nx += (nx > 0 ? 0.12 : -0.12); // push hemispheres apart slightly
    }
    neurons.push({
      nx, ny, nz,
      vx: (Math.random() - 0.5) * 0.00012,
      vy: (Math.random() - 0.5) * 0.00012,
      base: 0.25 + Math.random() * 0.15,
      glow: 0,
      glowColor: null,
      size: 1.2 + Math.random() * 0.8,
    });
  }

  // --- Static connections: nearby neurons ---
  const conns = [];
  const CONN_THRESHOLD = 0.22;
  for (let i = 0; i < N; i++) {
    for (let j = i + 1; j < N; j++) {
      const dx = neurons[i].nx - neurons[j].nx;
      const dy = neurons[i].ny - neurons[j].ny;
      const dz = neurons[i].nz - neurons[j].nz;
      const d = Math.sqrt(dx*dx + dy*dy + dz*dz);
      if (d < CONN_THRESHOLD) conns.push({ a: i, b: j, d: d });
    }
  }

  // --- Active synapses (soft pulses, color-coded) ---
  const MAX_SYN = 60;
  const synapses = [];
  for (let i = 0; i < MAX_SYN; i++) {
    synapses.push({ ci: -1, life: 0, max: 0, color: defaultColor });
  }

  // --- SSE: real activity with color-coded cognitive processes ---
  let pending = 0;
  let lastEvent = 'idle';
  const burst = { think: 12, tool: 8, memory: 18, browse: 10, learn: 25, cron: 5, heartbeat: 4, reasoning: 15 };

  // Color palette per cognitive process — [R, G, B]
  const eventColors = {
    think:     [129, 140, 248],  // indigo — reasoning/reflection
    memory:    [52,  211, 153],  // emerald — knowledge storage/retrieval
    learn:     [251, 191, 36],   // amber — learning/growth
    browse:    [56,  189, 248],  // sky — external research
    tool:      [244, 114, 182],  // pink — tool execution
    reasoning: [192, 132, 252],  // purple — background reasoning loop
    cron:      [148, 163, 184],  // slate — scheduled tasks
    heartbeat: [251, 113, 133],  // rose — vital signs
  };
  const defaultColor = [160, 180, 220]; // neutral blue-white

  // Queue of pending fires with their color
  const fireQueue = [];
  const evEl = document.getElementById('ev');
  let evTimeout;

  try {
    const es = new EventSource(location.origin + '/api/public/events');
    es.onmessage = function(e) {
      const type = e.data;
      const count = burst[type] || 6;
      const color = eventColors[type] || defaultColor;
      for (let i = 0; i < count; i++) fireQueue.push(color);
      lastEvent = type;
      evEl.textContent = type;
      evEl.setAttribute('data-type', type);
      evEl.classList.add('active');
      clearTimeout(evTimeout);
      evTimeout = setTimeout(() => {
        evEl.classList.remove('active');
        evEl.removeAttribute('data-type');
        evEl.textContent = 'idle';
      }, 3000);
    };
  } catch(e) {}

  // --- Render ---
  let time = 0;

  function getScreenPos(n) {
    // Scale factor: fill ~70% of viewport
    const scale = Math.min(W, H) * 0.38;
    return {
      x: cx() + n.nx * scale,
      y: cy() + n.ny * scale,
    };
  }

  function frame() {
    requestAnimationFrame(frame);
    time += 0.002;
    ctx.clearRect(0, 0, W, H);

    // Very slow rotation — preserve brain shape
    const cos = Math.cos(time * 0.08), sin = Math.sin(time * 0.08);

    // Update neuron positions (gentle drift + slow rotation)
    for (const n of neurons) {
      n.nx += n.vx;
      n.ny += n.vy;
      const d = Math.sqrt(n.nx*n.nx + n.ny*n.ny + n.nz*n.nz);
      if (d > 0.75) {
        n.vx -= n.nx * 0.0002;
        n.vy -= n.ny * 0.0002;
      }
      n.vx += (Math.random() - 0.5) * 0.000008;
      n.vy += (Math.random() - 0.5) * 0.000008;
      n.vx *= 0.995; n.vy *= 0.995;
      n.glow *= 0.94;

      // Apply slow Y rotation for 3D feel
      const rx = n.nx * cos - n.nz * sin;
      const rz = n.nx * sin + n.nz * cos;
      n._rx = rx; n._rz = rz;
    }

    // Fire synapses from real events (+ very slow ambient)
    for (let s = 0; s < MAX_SYN; s++) {
      if (synapses[s].life <= 0 && (fireQueue.length > 0 || Math.random() < 0.001)) {
        const color = fireQueue.length > 0 ? fireQueue.shift() : defaultColor;
        const ci = Math.floor(Math.random() * conns.length);
        const conn = conns[ci];
        const na = neurons[conn.a], nb = neurons[conn.b];
        synapses[s].ci = ci;
        synapses[s].max = 25 + Math.random() * 35;
        synapses[s].life = synapses[s].max;
        synapses[s].color = color;
        // Light up endpoint neurons with process color
        na.glow = 1; nb.glow = 1;
        na.glowColor = color; nb.glowColor = color;
        // Cascade: light up nearby neurons
        for (let k = 0; k < N; k++) {
          const dx = neurons[k].nx - na.nx, dy = neurons[k].ny - na.ny;
          if (dx*dx + dy*dy < 0.02) {
            neurons[k].glow = Math.max(neurons[k].glow, 0.6);
            neurons[k].glowColor = color;
          }
        }
      }
      if (synapses[s].life > 0) synapses[s].life--;
    }

    // Draw static connections (subtle network)
    ctx.lineWidth = 0.4;
    for (const conn of conns) {
      const pa = getScreenPos(neurons[conn.a]);
      const pb = getScreenPos(neurons[conn.b]);
      ctx.beginPath();
      ctx.moveTo(pa.x, pa.y);
      ctx.lineTo(pb.x, pb.y);
      ctx.strokeStyle = 'rgba(100,140,200,0.06)';
      ctx.stroke();
    }

    // Draw active synapse pulses (color-coded by cognitive process)
    for (let s = 0; s < MAX_SYN; s++) {
      if (synapses[s].life <= 0) continue;
      const conn = conns[synapses[s].ci];
      if (!conn) continue;
      const pa = getScreenPos(neurons[conn.a]);
      const pb = getScreenPos(neurons[conn.b]);
      const t = synapses[s].life / synapses[s].max;
      const alpha = Math.sin(t * Math.PI);
      const [cr, cg, cb] = synapses[s].color;
      // Soft glow line (process color, desaturated)
      ctx.save();
      ctx.filter = 'blur(3px)';
      ctx.beginPath();
      ctx.moveTo(pa.x, pa.y);
      ctx.lineTo(pb.x, pb.y);
      ctx.strokeStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',' + (alpha * 0.4) + ')';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.restore();
      // Bright core (lighter version of process color)
      const lr = Math.min(255, cr + 80), lg = Math.min(255, cg + 60), lb = Math.min(255, cb + 40);
      ctx.beginPath();
      ctx.moveTo(pa.x, pa.y);
      ctx.lineTo(pb.x, pb.y);
      ctx.strokeStyle = 'rgba(' + lr + ',' + lg + ',' + lb + ',' + (alpha * 0.6) + ')';
      ctx.lineWidth = 0.6;
      ctx.stroke();
    }

    // Draw neurons with multi-layer glow (color-coded by last cognitive process)
    for (const n of neurons) {
      const p = getScreenPos(n);
      const brightness = n.base + n.glow * 0.85;
      const r = n.size;
      // Active color from process, or default blue-white
      const gc = n.glowColor || defaultColor;
      const hasColor = n.glow > 0.15 && n.glowColor;

      // Layer 1: wide soft glow (process-colored when active)
      const glowRadius = r * (8 + n.glow * 12);
      const glowAlpha = 0.06 + n.glow * 0.45;
      ctx.save();
      if (n.glow > 0.2) ctx.filter = 'blur(2px)';
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowRadius);
      if (hasColor) {
        grad.addColorStop(0, 'rgba(' + gc[0] + ',' + gc[1] + ',' + gc[2] + ',' + glowAlpha + ')');
        grad.addColorStop(0.3, 'rgba(' + gc[0]*0.6 + ',' + gc[1]*0.6 + ',' + gc[2]*0.6 + ',' + (glowAlpha*0.4) + ')');
        grad.addColorStop(1, 'rgba(' + gc[0]*0.3 + ',' + gc[1]*0.3 + ',' + gc[2]*0.3 + ',0)');
      } else {
        grad.addColorStop(0, 'rgba(140,180,255,' + glowAlpha + ')');
        grad.addColorStop(0.3, 'rgba(80,130,220,' + (glowAlpha * 0.4) + ')');
        grad.addColorStop(1, 'rgba(40,80,180,0)');
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, glowRadius, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.restore();

      // Layer 2: core dot (process-colored when firing, blue-white at rest)
      ctx.beginPath();
      ctx.arc(p.x, p.y, r * 1.1, 0, Math.PI * 2);
      const coreAlpha = Math.min(brightness * 1.4, 1);
      if (hasColor && n.glow > 0.3) {
        // Bright core in process color
        const lr = Math.min(255, gc[0] + 70), lg = Math.min(255, gc[1] + 50), lb = Math.min(255, gc[2] + 30);
        ctx.fillStyle = 'rgba(' + lr + ',' + lg + ',' + lb + ',' + coreAlpha + ')';
      } else {
        // Cool blue-white at rest
        const cr = Math.round(120 + brightness * 60);
        const cg = Math.round(150 + brightness * 50);
        const cb = Math.round(200 + brightness * 40);
        ctx.fillStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',' + coreAlpha + ')';
      }
      ctx.fill();
    }
  }
  frame();
})();

// Status
fetch(location.origin + '/api/public/status')
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(d => {
    document.getElementById('dot').classList.add('on');
    document.getElementById('st').textContent = 'online' + (d.uptime ? ' · ' + d.uptime : '');
    if (d.uptime_short || d.uptime) document.getElementById('up').textContent = d.uptime_short || d.uptime;
    if (d.notes !== undefined) document.getElementById('mem').textContent = d.notes;
    if (d.model) document.getElementById('mdl').textContent = d.model;
  })
  .catch(() => { document.getElementById('st').textContent = 'offline'; });
</script>
</body>
</html>
